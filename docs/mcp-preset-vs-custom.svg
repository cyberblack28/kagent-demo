<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 22 1000 466" width="1000" height="466" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pvct pvcd" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="pvct">プリセットのツールと自作ツール（MCP サーバー）の登録の流れ</title>
  <desc id="pvcd">プリセットは kagent を Helm でインストールすると kagent tool server が起動し、RemoteMCPServer として登録済みになる。自作は MCP サーバーを作り、自分で起動して URL を RemoteMCPServer に登録するか（外部の MCP サーバーも URL を登録してつなぐ）、コンテナイメージを MCPServer に渡して kmcp に起動してもらう。登録後はどちらも同じで、controller がツールを検出し、Tools 画面に並び、エージェントに割り当てると、エージェントが MCP で呼び出す。</desc>
  <defs>
    <marker id="pvN" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="pvP" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    .pnl{fill:#f6f7f9;stroke:#e2e5ea;} .box{fill:#ffffff;stroke:#d7dbe0;} .boxP{fill:#ffffff;stroke:#7c3aed;}
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;}
    .mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;}
    .pur{fill:#7c3aed;font-weight:700;}
    .lnN{stroke:#6b7280;stroke-width:2;fill:none;} .lnP{stroke:#7c3aed;stroke-width:2;fill:none;}
  </style>
  <rect x="0" y="0" width="1000" height="500" fill="#ffffff"/>

  <!-- ===== LANE 1: プリセット ===== -->
  <rect class="pnl" x="18" y="40" width="540" height="170" rx="12"/>
  <circle cx="44" cy="66" r="12" fill="#6b7280"/><text x="44" y="70" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">1</text>
  <text x="66" y="70" font-size="15" class="t1">プリセット（kagent に最初から入っている）</text>

  <rect class="box" x="40" y="90" width="150" height="56" rx="8"/>
  <text x="115" y="113" text-anchor="middle" font-size="12.5" class="t1">kagent をインストール</text>
  <text x="115" y="132" text-anchor="middle" font-size="10.5" class="t2">Helm チャート</text>
  <line class="lnN" x1="190" y1="118" x2="220" y2="118" marker-end="url(#pvN)"/>

  <rect class="box" x="226" y="90" width="150" height="56" rx="8"/>
  <text x="301" y="113" text-anchor="middle" font-size="12.5" class="t1">kagent tool server</text>
  <text x="301" y="132" text-anchor="middle" font-size="10.5" class="t2">Deployment / Service で起動</text>
  <line class="lnN" x1="376" y1="118" x2="406" y2="118" marker-end="url(#pvN)"/>

  <rect class="box" x="412" y="90" width="128" height="56" rx="8"/>
  <text x="476" y="113" text-anchor="middle" font-size="12" class="t1 mono">RemoteMCPServer</text>
  <text x="476" y="132" text-anchor="middle" font-size="10.5" class="t2">登録済み</text>

  <text x="288" y="182" text-anchor="middle" font-size="12" class="t2">ユーザーは何もしなくてよい（最初から一覧に出る）</text>

  <!-- ===== LANE 2: 自作 ===== -->
  <rect class="pnl" x="18" y="226" width="540" height="244" rx="12"/>
  <circle cx="44" cy="252" r="12" fill="#7c3aed"/><text x="44" y="256" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">2</text>
  <text x="66" y="256" font-size="15" class="t1">自作（自分で作って登録する）</text>

  <rect class="boxP" x="40" y="282" width="150" height="76" rx="8"/>
  <text x="115" y="306" text-anchor="middle" font-size="12.5" class="pur">MCP サーバーを作る</text>
  <text x="115" y="326" text-anchor="middle" font-size="10.5" class="t2">ツールの名前・説明・</text>
  <text x="115" y="342" text-anchor="middle" font-size="10.5" class="t2">引数を定義する</text>

  <path class="lnP" d="M190 320 H206 V298 H220" marker-end="url(#pvP)"/>
  <path class="lnP" d="M206 320 V379 H220" marker-end="url(#pvP)"/>

  <rect class="box" x="226" y="262" width="314" height="72" rx="8"/>
  <text x="242" y="285" font-size="12.5" class="t1">自分で起動する → <tspan class="pur mono" font-size="12">RemoteMCPServer</tspan></text>
  <text x="242" y="305" font-size="10.5" class="t2">Deployment などで動かし、URL を登録する</text>
  <text x="242" y="322" font-size="10.5" class="t2">外部の MCP サーバー（SaaS など）も URL を登録してつなぐ</text>

  <rect class="box" x="226" y="348" width="314" height="62" rx="8"/>
  <text x="242" y="372" font-size="12.5" class="t1">kmcp に起動してもらう → <tspan class="pur mono" font-size="12">MCPServer</tspan></text>
  <text x="242" y="393" font-size="10.5" class="t2">コンテナイメージを渡すと Deployment と Service を作る</text>

  <text x="288" y="440" text-anchor="middle" font-size="12.5" class="pur">どちらで登録しても、この先はプリセットと同じ</text>

  <!-- ===== COMMON: 登録した後は同じ ===== -->
  <rect class="pnl" x="590" y="40" width="392" height="430" rx="12"/>

  <!-- converge into the common flow (drawn after the panel so the arrowheads stay visible) -->
  <line class="lnN" x1="540" y1="108" x2="604" y2="108" marker-end="url(#pvN)"/>
  <path class="lnP" d="M540 298 H572"/>
  <path class="lnP" d="M540 379 H572 V128 H604" marker-end="url(#pvP)"/>
  <text x="786" y="70" text-anchor="middle" font-size="15" class="t1">登録した後は、プリセットも自作も同じ</text>

  <rect class="box" x="612" y="86" width="348" height="62" rx="8"/>
  <circle cx="636" cy="117" r="11" fill="#1a1d21"/><text x="636" y="121" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">3</text>
  <text x="658" y="112" font-size="12.5" class="t1">controller がツールを検出</text>
  <text x="658" y="131" font-size="10.5" class="t2">登録先に接続して、ツールの一覧を取得する</text>
  <line class="lnN" x1="786" y1="148" x2="786" y2="168" marker-end="url(#pvN)"/>

  <rect class="box" x="612" y="172" width="348" height="62" rx="8"/>
  <circle cx="636" cy="203" r="11" fill="#1a1d21"/><text x="636" y="207" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">4</text>
  <text x="658" y="198" font-size="12.5" class="t1">UI の Tools 画面に並ぶ</text>
  <text x="658" y="217" font-size="10.5" class="t2">プリセットも自作も、同じ一覧に表示される</text>
  <line class="lnN" x1="786" y1="234" x2="786" y2="254" marker-end="url(#pvN)"/>

  <rect class="box" x="612" y="258" width="348" height="62" rx="8"/>
  <circle cx="636" cy="289" r="11" fill="#1a1d21"/><text x="636" y="293" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">5</text>
  <text x="658" y="284" font-size="12.5" class="t1">エージェントに割り当てる</text>
  <text x="658" y="303" font-size="10.5" class="t2">UI で選ぶ ／ YAML の <tspan class="mono">toolNames</tspan> に書く → Agent Details に表示</text>
  <line class="lnN" x1="786" y1="320" x2="786" y2="340" marker-end="url(#pvN)"/>

  <rect class="box" x="612" y="344" width="348" height="62" rx="8"/>
  <circle cx="636" cy="375" r="11" fill="#1a1d21"/><text x="636" y="379" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">6</text>
  <text x="658" y="370" font-size="12.5" class="t1">エージェントが MCP で呼び出す</text>
  <text x="658" y="389" font-size="10.5" class="t2">LLM がツールの説明文を読んで、呼ぶツールを選ぶ</text>

  <text x="786" y="440" text-anchor="middle" font-size="12" class="t2">呼び出し方（MCP）も同じ</text>

</svg>
