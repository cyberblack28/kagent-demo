<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 610" width="1120" height="610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kht khd" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="kht">khook 概要 — Kubernetes イベントでエージェントを自動起動する</title>
  <desc id="khd">khook は Kubernetes の Event を監視し、A2A プロトコルで kagent のエージェントを自動起動するコントローラ。公式の呼び方は reactive agents であり、本資料ではこれを「いつ動くか（起動の契機）を設計する層」＝ループとして整理している。監視できるイベントは pod-restart, pod-pending, oom-kill, probe-failed, node-not-ready の5種。Hook リソースに eventType, agentRef, prompt を YAML で宣言する。同一イベントは10分間重複抑制される。現時点では v0.0.4 の実験的プロジェクト。</desc>
  <defs>
    <marker id="ka" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
  </defs>
  <style>
    .pnl{fill:#f6f7f9;stroke:#e2e5ea;} .box{fill:#ffffff;stroke:#d7dbe0;}
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;} .tb{fill:#1a1d21;}
    .mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;}
    .pur{fill:#7c3aed;font-weight:700;}
    .cmt{fill:#94a3b8;} .key{fill:#7c3aed;}
  </style>
  <rect x="0" y="0" width="1120" height="610" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="40" font-size="19" class="t1">khook ― Kubernetes イベントでエージェントを自動起動する</text>
  <rect x="920" y="26" width="170" height="26" rx="13" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1005" y="43" text-anchor="middle" font-size="10.5" fill="#b45309" font-weight="700">v0.0.4 ・ 実験的プロジェクト</text>

  <text x="30" y="63" font-size="12" class="t2">kagent-dev/khook（kagent と同じ org の関連プロジェクト）／ 公式の呼び方は「reactive agents」</text>
  <text x="30" y="81" font-size="12" class="t2">※ 本資料では、これを「<tspan class="pur">いつ動くか（起動の契機）を設計する層</tspan>」＝ループとして整理している</text>

  <!-- ===== Flow band ===== -->
  <rect class="pnl" x="30" y="96" width="1060" height="125" rx="10"/>

  <rect class="box" x="46" y="114" width="210" height="72" rx="8"/>
  <text x="151" y="140" text-anchor="middle" font-size="13" class="t1">Kubernetes Event</text>
  <text x="151" y="161" text-anchor="middle" font-size="11" class="t2">Pod 再起動 / OOM など</text>

  <line x1="262" y1="150" x2="306" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ka)"/>
  <text x="284" y="140" text-anchor="middle" font-size="10" class="t2">検知</text>

  <rect class="box" x="312" y="114" width="210" height="72" rx="8" stroke="#7c3aed"/>
  <text x="417" y="140" text-anchor="middle" font-size="13" class="pur">khook</text>
  <text x="417" y="161" text-anchor="middle" font-size="11" class="t2">Kubernetes コントローラ</text>

  <line x1="528" y1="150" x2="572" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ka)"/>
  <text x="550" y="140" text-anchor="middle" font-size="10" class="t2">A2A</text>

  <rect class="box" x="578" y="114" width="210" height="72" rx="8"/>
  <text x="683" y="140" text-anchor="middle" font-size="13" class="t1">kagent エージェント</text>
  <text x="683" y="161" text-anchor="middle" font-size="11" class="t2">k8s-agent など</text>

  <line x1="794" y1="150" x2="838" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#ka)"/>
  <text x="816" y="140" text-anchor="middle" font-size="10" class="t2">実行</text>

  <rect class="box" x="844" y="114" width="210" height="72" rx="8"/>
  <text x="949" y="140" text-anchor="middle" font-size="13" class="t1">調査して報告</text>
  <text x="949" y="161" text-anchor="middle" font-size="11" class="t2">（修復まで任せる設計も可）</text>

  <text x="46" y="208" font-size="11" class="t2">※ khook は prompt とイベントの文脈を A2A で送る。同一イベントは 10 分間 重複抑制（dedup）― 繰り返し起動して振動するのを防ぐ</text>

  <!-- ===== Left panel: events + points ===== -->
  <rect class="pnl" x="30" y="239" width="520" height="262" rx="10"/>
  <text x="46" y="264" font-size="13" class="t1">監視できるイベント（5種）</text>

  <rect x="46" y="276" width="100" height="26" rx="13" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="96" y="293" text-anchor="middle" font-size="10.5" class="mono tb">pod-restart</text>
  <rect x="156" y="276" width="104" height="26" rx="13" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="208" y="293" text-anchor="middle" font-size="10.5" class="mono tb">pod-pending</text>
  <rect x="270" y="276" width="88" height="26" rx="13" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="314" y="293" text-anchor="middle" font-size="10.5" class="mono tb">oom-kill</text>
  <rect x="46" y="310" width="106" height="26" rx="13" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="99" y="327" text-anchor="middle" font-size="10.5" class="mono tb">probe-failed</text>
  <rect x="162" y="310" width="122" height="26" rx="13" fill="#ffffff" stroke="#d7dbe0"/>
  <text x="223" y="327" text-anchor="middle" font-size="10.5" class="mono tb">node-not-ready</text>

  <line x1="46" y1="356" x2="534" y2="356" stroke="#e2e5ea"/>

  <text x="46" y="380" font-size="13" class="t1">ポイント</text>
  <text x="46" y="402" font-size="11.5" class="t2">・人が頼まなくても、イベントがエージェントを呼ぶ</text>
  <text x="46" y="423" font-size="11.5" class="t2">・プロンプトは消えず、Hook の YAML に「宣言」として残る</text>
  <text x="46" y="444" font-size="11.5" class="t2">・呼び出しは A2A。kagent 以外の A2A 対応エージェントも呼べる</text>
  <text x="46" y="465" font-size="11.5" class="t2">・ループを回す手段は他にも（cron / アラート webhook → A2A）</text>
  <text x="46" y="486" font-size="11.5" class="t2">・公式サンプルは全自動修復。まずは「調査して報告」から</text>

  <!-- ===== Right panel: Hook YAML ===== -->
  <rect class="pnl" x="570" y="239" width="520" height="262" rx="10"/>
  <text x="586" y="264" font-size="13" class="t1">Hook ― YAML で宣言する</text>

  <rect x="586" y="276" width="488" height="205" rx="8" fill="#ffffff" stroke="#d7dbe0"/>
  <g font-size="10.5" class="mono">
    <text x="600" y="295" class="tb">apiVersion: <tspan class="key">kagent.dev/v1alpha2</tspan></text>
    <text x="600" y="309" class="tb">kind: <tspan class="key">Hook</tspan></text>
    <text x="600" y="323" class="tb">metadata:</text>
    <text x="613" y="337" class="tb">namespace: demo-app <tspan class="cmt"># 監視する namespace</tspan></text>
    <text x="600" y="351" class="tb">spec:</text>
    <text x="613" y="365" class="tb">eventConfigurations:</text>
    <text x="626" y="379" class="tb">- eventType: pod-restart <tspan class="cmt"># 何を検知するか</tspan></text>
    <text x="639" y="393" class="tb">agentRef:</text>
    <text x="652" y="407" class="tb">name: k8s-agent <tspan class="cmt"># 誰を呼ぶか</tspan></text>
    <text x="652" y="421" class="tb">namespace: kagent</text>
    <text x="639" y="435" class="tb">prompt: | <tspan class="cmt"># 何を頼むか</tspan></text>
    <text x="652" y="449" class="tb">Pod {{.ResourceName}} が再起動しました。</text>
    <text x="652" y="463" class="tb">調査のみ行い、変更はしないでください。</text>
  </g>

  <!-- ===== Bottom band ===== -->
  <rect class="pnl" x="30" y="516" width="1060" height="70" rx="10"/>
  <text x="54" y="543" font-size="14" class="pur">Human in the loop  →  Human on the loop</text>
  <text x="440" y="543" font-size="12" class="t2">人が「毎回承認する」から、人が「見張る」へ</text>
  <text x="54" y="568" font-size="11.5" class="t2">ただし、どこまで任せるかは設計事項。非決定性・説明責任を考えれば、まずは「自動で調べて報告」までを任せるのが現実的。</text>
</svg>
