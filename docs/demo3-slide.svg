<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s3t s3d" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="s3t">デモ3: Service と Pod のつながりを調べて直す</title>
  <desc id="s3d">Pod は正常なのに Service から届かない障害を、k8s-agent が Service の selector・Pod の label・Endpoints を突き合わせて selector の不一致と特定し、修正値を指示せず意図だけを伝えて修復させるデモのスライド。左に2つの依頼文と結果、右に OCI Generative AI・kagent・OCI Kubernetes Engine(Service demo-web、Endpoints、Pod)の構成を示す。</desc>
  <defs>
    <marker id="sN" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="sR" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#dc2626"/></marker>
  </defs>
  <style>
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;} .tb{fill:#1a1d21;}
    .mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;}
    .ok{fill:#16a34a;font-weight:700;} .bad{fill:#dc2626;font-weight:700;} .pur{fill:#7c3aed;font-weight:700;}
    .pnl{fill:#f6f7f9;stroke:#e2e5ea;} .box{fill:#ffffff;stroke:#d7dbe0;}
    .lnN{stroke:#6b7280;stroke-width:1.8;} .lnR{stroke:#dc2626;stroke-width:1.8;stroke-dasharray:5 4;}
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- ===== Title ===== -->
  <text x="40" y="62" font-size="26" class="t1">デモ3: Service と Pod のつながりを調べて直す</text>
  <text x="40" y="94" font-size="15" class="t2">Pod は正常なのに届かない。複数のリソースの関係を読み解かせる</text>

  <!-- ===== Left: Card 1 (調査) ===== -->
  <rect class="pnl" x="40" y="124" width="670" height="156" rx="12"/>
  <rect x="60" y="142" width="112" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="116" y="161" text-anchor="middle" font-size="13" class="t1">k8s-agent</text>
  <text x="186" y="161" font-size="13.5" class="t2">① 届かない理由を調べてもらう</text>
  <rect class="box" x="60" y="182" width="630" height="54" rx="8"/>
  <text x="76" y="205" font-size="14" class="tb">demo-app namespace の demo-web Service が Pod に届かない理由を調べてください。</text>
  <text x="76" y="225" font-size="14" class="tb">Service selector, Pod label, endpoints の観点で確認してください。</text>
  <text x="60" y="264" font-size="14" class="t2">→ selector と Pod の label が<tspan class="bad">一致せず、Endpoints が空</tspan>になっていると特定</text>

  <!-- ===== Left: Card 2 (修復) ===== -->
  <rect class="pnl" x="40" y="298" width="670" height="312" rx="12"/>
  <rect x="60" y="316" width="112" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="116" y="335" text-anchor="middle" font-size="13" class="t1">k8s-agent</text>
  <text x="186" y="335" font-size="13.5" class="t2">② 修正値は言わず、意図だけ伝えて直してもらう</text>
  <rect class="box" x="60" y="356" width="630" height="84" rx="8"/>
  <text x="76" y="380" font-size="14" class="tb">selector の不一致が原因ですね。demo-web Service の selector を、</text>
  <text x="76" y="402" font-size="14" class="tb">実際に稼働している Pod のラベルに合わせて修正してください。</text>
  <text x="76" y="424" font-size="14" class="tb">修正後、endpoints に Pod が復帰したことを確認して報告してください。</text>

  <text x="60" y="476" font-size="14" class="t2">→ <tspan class="pur">正しい値（app=demo-web）はエージェントが Pod のラベルから特定</tspan>して修正</text>
  <text x="60" y="502" font-size="14" class="t2">→ <tspan class="ok">Endpoints に Pod の IP が2つ復帰</tspan>し、Service から届くようになる</text>
  <text x="60" y="528" font-size="14" class="t2">→ 最後に人が <tspan class="mono" font-size="13">kubectl get endpoints</tspan> で事実確認</text>
  <text x="60" y="588" font-size="12.5" class="t2">デモ1・2は1つのオブジェクトの調査。デモ3は複数のリソースの「関係」の調査と修復</text>

  <!-- ===== Right: Architecture ===== -->
  <rect class="box" x="800" y="124" width="400" height="46" rx="8"/>
  <text x="1000" y="144" text-anchor="middle" font-size="14" class="t1">OCI Generative AI</text>
  <text x="1000" y="161" text-anchor="middle" font-size="11" class="t2 mono">openai.gpt-oss-120b</text>
  <line class="lnN" x1="1000" y1="170" x2="1000" y2="192" marker-end="url(#sN)"/>

  <rect class="pnl" x="760" y="196" width="480" height="188" rx="12"/>
  <text x="776" y="216" font-size="13" class="t1">kagent</text>
  <rect x="800" y="226" width="200" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="900" y="251" text-anchor="middle" font-size="13" class="t1">k8s-agent</text>
  <rect class="box" x="800" y="326" width="200" height="40" rx="8"/>
  <text x="900" y="351" text-anchor="middle" font-size="11.5" class="t1 mono">kagent-tool-server</text>
  <line class="lnN" x1="900" y1="266" x2="900" y2="322" marker-end="url(#sN)"/>
  <text x="908" y="299" font-size="11" class="t2">MCP</text>
  <text x="1024" y="322" font-size="10" class="t2">使ったツールの例</text>
  <text x="1024" y="338" font-size="10" class="t2 mono">k8s_get_resource_yaml</text>
  <text x="1024" y="352" font-size="10" class="t2 mono">k8s_check_service_connectivity</text>
  <text x="1024" y="366" font-size="10" class="t2 mono">k8s_patch_resource</text>

  <rect class="pnl" x="760" y="404" width="480" height="206" rx="12"/>
  <text x="1012" y="424" text-anchor="middle" font-size="13" class="t1">OCI Kubernetes Engine</text>
  <rect class="box" x="780" y="434" width="440" height="164" rx="8"/>
  <text x="792" y="452" font-size="11" class="t2 mono">demo-app</text>

  <!-- Service -->
  <rect x="800" y="470" width="180" height="62" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="890" y="491" text-anchor="middle" font-size="12" class="t1">Service <tspan class="mono">demo-web</tspan></text>
  <text x="890" y="509" text-anchor="middle" font-size="10" class="t2">selector</text>
  <text x="890" y="524" text-anchor="middle" font-size="10" class="bad mono">app=demo-web-mismatch</text>
  <!-- Endpoints -->
  <rect x="800" y="546" width="180" height="40" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="890" y="564" text-anchor="middle" font-size="11.5" class="t1">Endpoints</text>
  <text x="890" y="579" text-anchor="middle" font-size="10" class="bad">空（届く先がない）</text>
  <!-- Pods -->
  <rect x="1040" y="470" width="160" height="116" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="1120" y="491" text-anchor="middle" font-size="12" class="t1">Pod <tspan class="mono">demo-web</tspan> ×2</text>
  <text x="1120" y="512" text-anchor="middle" font-size="10" class="t2">label</text>
  <text x="1120" y="527" text-anchor="middle" font-size="10" class="ok mono">app=demo-web</text>
  <text x="1120" y="552" text-anchor="middle" font-size="11" class="ok">Running</text>
  <text x="1120" y="570" text-anchor="middle" font-size="10" class="t2">Pod 自体は正常</text>

  <line class="lnR" x1="984" y1="501" x2="1034" y2="501" marker-end="url(#sR)"/>
  <text x="1010" y="493" text-anchor="middle" font-size="12" class="bad">×</text>
  <text x="1010" y="520" text-anchor="middle" font-size="9.5" class="bad">不一致</text>

  <line class="lnN" x1="900" y1="366" x2="900" y2="466" marker-end="url(#sN)"/>
  <text x="908" y="398" font-size="10" class="t2">Service / Endpoints / Pod を突き合わせる</text>

  <!-- ===== Bottom message ===== -->
  <rect x="40" y="632" width="1200" height="64" rx="12" fill="#f6f7f9" stroke="#e2e5ea"/>
  <text x="62" y="660" font-size="15" class="t1">ログにもイベントにも出ない障害を、<tspan class="pur">リソースの関係から読み解く</tspan></text>
  <text x="62" y="684" font-size="13" class="t2">「何に合わせるか」という意図だけを伝え、正しい値の特定と修正はエージェントに任せる</text>
</svg>
