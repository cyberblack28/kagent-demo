<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d6t d6d" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="d6t">デモ6: khook によるイベント駆動でエージェントを自動起動する</title>
  <desc id="d6d">人が demo-crashloop を適用して障害を仕組むと Pod が再起動を繰り返し Kubernetes Event が発生する。khook がそれを検知し A2A で k8s-agent を自動起動する。エージェントは誰にも頼まれずに調査を終え、kagent UI に hook-pod-restart という名前のセッションとして報告を残す。同一イベントは10分間重複抑制される。</desc>
  <defs>
    <marker id="e6N" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="e6G" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#16a34a"/></marker>
  </defs>
  <style>
    .pnl{fill:#f6f7f9;stroke:#e2e5ea;} .box{fill:#ffffff;stroke:#d7dbe0;}
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;}
    .mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;}
    .ok{fill:#16a34a;font-weight:700;} .bad{fill:#dc2626;font-weight:700;} .pur{fill:#7c3aed;font-weight:700;}
    .lnkN{stroke:#6b7280;stroke-width:2;} .lnkG{stroke:#16a34a;stroke-width:2;}
  </style>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <!-- ===== PANEL A: 障害を仕組む ===== -->
  <rect class="pnl" x="18" y="40" width="300" height="430" rx="12"/>
  <circle cx="44" cy="66" r="12" fill="#dc2626"/><text x="44" y="70" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">1</text>
  <text x="66" y="70" font-size="15" class="t1">障害を仕組む</text>

  <rect class="box" x="58" y="90" width="220" height="50" rx="8"/>
  <text x="168" y="111" text-anchor="middle" font-size="13" class="t1">kubectl apply</text>
  <text x="168" y="129" text-anchor="middle" font-size="10.5" class="t2">20-demo-fault-crashloop.yaml</text>
  <line class="lnkN" x1="168" y1="140" x2="168" y2="160" marker-end="url(#e6N)"/>

  <rect class="box" x="58" y="162" width="220" height="52" rx="8" stroke="#dc2626"/>
  <text x="168" y="181" text-anchor="middle" font-size="11" class="t2">Kubernetes Event</text>
  <text x="168" y="201" text-anchor="middle" font-size="12" class="bad mono">BackOff</text>
  <line class="lnkN" x1="168" y1="214" x2="168" y2="234" marker-end="url(#e6N)"/>

  <rect class="box" x="78" y="236" width="180" height="52" rx="8" stroke="#dc2626"/>
  <text x="168" y="255" text-anchor="middle" font-size="12" class="t2">Pod status</text>
  <text x="168" y="275" text-anchor="middle" font-size="13.5" class="bad">CrashLoopBackOff</text>

  <text x="168" y="322" text-anchor="middle" font-size="12.5" class="bad">人が行うのはここまで</text>
  <text x="168" y="344" text-anchor="middle" font-size="11.5" class="t2">以降、チャットは一切打たない</text>

  <!-- ===== PANEL B: khook が自動起動 ===== -->
  <rect class="pnl" x="350" y="40" width="300" height="430" rx="12"/>
  <circle cx="376" cy="66" r="12" fill="#7c3aed"/><text x="376" y="70" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">2</text>
  <text x="398" y="70" font-size="15" class="t1">khook が自動起動</text>

  <rect x="378" y="86" width="244" height="26" rx="13" fill="none" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="500" y="103" text-anchor="middle" font-size="10.5" class="pur">Hook の宣言どおりに実行</text>

  <rect class="box" x="378" y="122" width="244" height="100" rx="8"/>
  <text x="392" y="145" font-size="10" class="t2 mono">Discovered interesting event</text>
  <text x="392" y="167" font-size="10" class="t1 mono">Agent accepted via A2A</text>
  <text x="392" y="189" font-size="10" class="ok mono">Agent call completed</text>
  <line x1="392" y1="199" x2="608" y2="199" stroke="#eceef1"/>
  <text x="392" y="212" font-size="10.5" class="t2">検知 → 応答まで 約10秒</text>

  <text x="500" y="250" text-anchor="middle" font-size="12" class="t1">起きたこと</text>
  <text x="500" y="272" text-anchor="middle" font-size="12.5" class="pur">イベントがエージェントを呼んだ</text>

  <text x="500" y="322" text-anchor="middle" font-size="12" class="t1">→ 人は誰も呼んでいない</text>
  <text x="500" y="344" text-anchor="middle" font-size="11.5" class="t2">Hook の YAML が「呼ぶ人」を代行</text>

  <!-- ===== PANEL C: エージェントが報告 ===== -->
  <rect class="pnl" x="682" y="40" width="300" height="430" rx="12"/>
  <circle cx="708" cy="66" r="12" fill="#16a34a"/><text x="708" y="70" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">3</text>
  <text x="730" y="70" font-size="15" class="t1">エージェントが報告</text>

  <rect class="box" x="722" y="90" width="220" height="50" rx="8"/>
  <text x="832" y="111" text-anchor="middle" font-size="13" class="t1">kagent UI</text>
  <text x="832" y="129" text-anchor="middle" font-size="10.5" class="t2">k8s-agent のセッション一覧</text>
  <line class="lnkG" x1="832" y1="140" x2="832" y2="160" marker-end="url(#e6G)"/>

  <rect class="box" x="722" y="162" width="220" height="52" rx="8" stroke="#16a34a"/>
  <text x="832" y="181" text-anchor="middle" font-size="10.5" class="t2">新しい会話が増えている</text>
  <text x="832" y="201" text-anchor="middle" font-size="11" class="ok mono">hook-pod-restart-…</text>
  <line class="lnkG" x1="832" y1="214" x2="832" y2="234" marker-end="url(#e6G)"/>

  <rect class="box" x="722" y="236" width="220" height="52" rx="8" stroke="#16a34a"/>
  <text x="832" y="255" text-anchor="middle" font-size="10.5" class="t2">固定フォーマットの報告</text>
  <text x="832" y="275" text-anchor="middle" font-size="11.5" class="t1">【状況】【原因】【推奨アクション】</text>

  <text x="832" y="322" text-anchor="middle" font-size="12.5" class="ok">頼まないのに報告が届く</text>
  <text x="832" y="344" text-anchor="middle" font-size="11.5" class="t2">調査のみ・変更はしない</text>

  <!-- ===== 凡例 / ポイント ===== -->
  <rect x="18" y="486" width="964" height="58" rx="10" fill="#f6f7f9" stroke="#e2e5ea"/>
  <circle cx="42" cy="507" r="6" fill="#dc2626"/><text x="54" y="511" font-size="11.5" class="t2">障害の発生（人が仕組む）</text>
  <circle cx="42" cy="528" r="6" fill="#7c3aed"/><text x="54" y="532" font-size="11.5" class="t2">khook が検知して自動起動</text>
  <text x="300" y="511" font-size="12" class="t1">見どころ：</text>
  <text x="300" y="531" font-size="11.5" class="t2">人が頼んでいないのに、エージェントが調査を終えて報告している</text>
  <text x="740" y="511" font-size="12" class="t1">ブレーキ：</text>
  <text x="740" y="531" font-size="11.5" class="t2">同一イベントは 10 分間抑制</text>
</svg>
