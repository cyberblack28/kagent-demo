# デモ5(追加)のサンプルアプリ。カナリアの見栄えが良い Argo 公式デモアプリを使う。
# - イメージは quay.io 完全修飾なので、OKE(Oracle Linux)の short-name 解決問題
#   (nginx などの短縮名で出る ImageInspectError)を回避できる。
# - rollouts-demo はバージョンごとに色が変わる(blue/yellow/green...)ので、
#   カナリアの新旧混在が一目で分かる。listen ポートは 8080。
# - demo-web(10-demo-app.yaml)とは別物なので、デモ1〜3 には影響しない。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-rollout
  namespace: demo-app
  labels:
    app: demo-rollout
spec:
  replicas: 4
  selector:
    matchLabels:
      app: demo-rollout
  template:
    metadata:
      labels:
        app: demo-rollout
    spec:
      containers:
        - name: rollouts-demo
          image: quay.io/argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "5m"
              memory: "32Mi"
            limits:
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-rollout
  namespace: demo-app
spec:
  selector:
    app: demo-rollout
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
