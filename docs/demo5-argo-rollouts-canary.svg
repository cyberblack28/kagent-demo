<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 600" width="1040" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d5t d5d" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="d5t">デモ5: Deployment を Argo Rollouts のカナリアへ移行する流れ</title>
  <desc id="d5d">現状の Deployment(v1) を、エージェントが Rollout(カナリア)へ変換しイメージを v2 に更新。25%→50%→100% と各段階で pause し、人間が承認(promote)するとエージェントが昇格を実行して全 Pod が v2 になる。前提として Argo Rollouts コントローラを事前導入する(Argo CD は不要)。</desc>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
  </defs>
  <style>
    .pnl{fill:#f6f7f9;stroke:#e2e5ea;} .card{fill:#ffffff;stroke:#d7dbe0;}
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;}
    .new{fill:#eab308;stroke:#ca8a04;} .old{fill:#3b82f6;stroke:#2563eb;}
    .grn{fill:#16a34a;font-weight:700;} .amb{fill:#b45309;font-weight:700;} .pur{fill:#7c3aed;font-weight:700;}
  </style>
  <rect x="0" y="0" width="1040" height="600" fill="#ffffff"/>

  <!-- Title & legend -->
  <text x="35" y="44" font-size="18" class="t1">デモ5: Deployment → Argo Rollouts カナリアへの移行</text>
  <rect x="720" y="30" width="14" height="14" rx="3" class="new"/><text x="740" y="42" font-size="12" class="t2">新バージョン(yellow)</text>
  <rect x="880" y="30" width="14" height="14" rx="3" class="old"/><text x="900" y="42" font-size="12" class="t2">旧バージョン(blue)</text>

  <!-- ===== Stage cards ===== -->
  <!-- Card1: 現状 (cx=130) -->
  <rect class="pnl" x="35" y="96" width="190" height="206" rx="12"/>
  <text x="130" y="122" text-anchor="middle" font-size="13" class="t1">① 現状</text>
  <text x="130" y="141" text-anchor="middle" font-size="11" class="t2">demo-rollout (blue)</text>
  <rect class="old" x="93"  y="158" width="32" height="32" rx="6"/>
  <rect class="old" x="135" y="158" width="32" height="32" rx="6"/>
  <rect class="old" x="93"  y="200" width="32" height="32" rx="6"/>
  <rect class="old" x="135" y="200" width="32" height="32" rx="6"/>
  <text x="130" y="256" text-anchor="middle" font-size="12" class="t2">ローリングのみ</text>
  <text x="130" y="276" text-anchor="middle" font-size="10.5" class="t2">段階的な出し方はできない</text>

  <!-- Card2: 変換+カナリア開始 (cx=390) -->
  <rect class="pnl" x="295" y="96" width="190" height="206" rx="12"/>
  <text x="390" y="122" text-anchor="middle" font-size="12.5" class="t1">② 変換＋カナリア開始</text>
  <text x="390" y="141" text-anchor="middle" font-size="11" class="t2">Rollout(canary)</text>
  <rect class="new" x="353" y="158" width="32" height="32" rx="6"/>
  <rect class="old" x="395" y="158" width="32" height="32" rx="6"/>
  <rect class="old" x="353" y="200" width="32" height="32" rx="6"/>
  <rect class="old" x="395" y="200" width="32" height="32" rx="6"/>
  <text x="390" y="256" text-anchor="middle" font-size="12" class="amb">pause ・ 25%</text>
  <text x="390" y="276" text-anchor="middle" font-size="10.5" class="t2">Service はそのまま</text>

  <!-- Card3: 昇格(承認) (cx=650) -->
  <rect class="pnl" x="555" y="96" width="190" height="206" rx="12"/>
  <text x="650" y="122" text-anchor="middle" font-size="13" class="t1">③ 昇格(承認)</text>
  <text x="650" y="141" text-anchor="middle" font-size="11" class="t2">カナリア継続</text>
  <rect class="new" x="613" y="158" width="32" height="32" rx="6"/>
  <rect class="new" x="655" y="158" width="32" height="32" rx="6"/>
  <rect class="old" x="613" y="200" width="32" height="32" rx="6"/>
  <rect class="old" x="655" y="200" width="32" height="32" rx="6"/>
  <text x="650" y="256" text-anchor="middle" font-size="12" class="amb">pause ・ 50%</text>
  <text x="650" y="276" text-anchor="middle" font-size="10.5" class="t2">問題なければ次へ</text>

  <!-- Card4: 完了 (cx=910) -->
  <rect class="pnl" x="815" y="96" width="190" height="206" rx="12"/>
  <text x="910" y="122" text-anchor="middle" font-size="13" class="t1">④ 完了</text>
  <text x="910" y="141" text-anchor="middle" font-size="11" class="t2">全 Pod が yellow</text>
  <rect class="new" x="873" y="158" width="32" height="32" rx="6"/>
  <rect class="new" x="915" y="158" width="32" height="32" rx="6"/>
  <rect class="new" x="873" y="200" width="32" height="32" rx="6"/>
  <rect class="new" x="915" y="200" width="32" height="32" rx="6"/>
  <text x="910" y="256" text-anchor="middle" font-size="12" class="grn">100% 完了</text>
  <text x="910" y="276" text-anchor="middle" font-size="10.5" class="t2">blue → yellow へ更新</text>

  <!-- ===== Transitions (arrows + actor) ===== -->
  <!-- gap1: 260 -->
  <line x1="230" y1="199" x2="290" y2="199" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="260" y="150" text-anchor="middle" font-size="9.5" class="pur">エージェント</text>
  <text x="260" y="163" text-anchor="middle" font-size="9.5" class="t2">変換＋更新</text>
  <!-- gap2: 520 -->
  <line x1="490" y1="199" x2="550" y2="199" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="520" y="150" text-anchor="middle" font-size="9.5" class="amb">人間が承認</text>
  <text x="520" y="163" text-anchor="middle" font-size="9.5" class="t2">→ promote</text>
  <!-- gap3: 780 -->
  <line x1="750" y1="199" x2="810" y2="199" stroke="#6b7280" stroke-width="2" marker-end="url(#ar)"/>
  <text x="780" y="150" text-anchor="middle" font-size="9.5" class="amb">人間が承認</text>
  <text x="780" y="163" text-anchor="middle" font-size="9.5" class="t2">→ promote</text>

  <!-- Step 0 note -->
  <text x="35" y="325" font-size="11" class="t2">手順0: エージェントが「コントローラが入っているか」を確認してから開始</text>

  <!-- ===== Role / prereq band ===== -->
  <rect class="pnl" x="35" y="340" width="970" height="118" rx="12"/>
  <text x="58" y="372" font-size="12.5" class="amb">人間の役割：</text>
  <text x="150" y="372" font-size="12" class="t2">意図（カナリア戦略）を伝え、各段階を「承認(promote)」する</text>
  <text x="58" y="402" font-size="12.5" class="pur">エージェントの役割：</text>
  <text x="192" y="402" font-size="12" class="t2">コントローラ確認・Rollout へ変換・イメージ更新・昇格の実行</text>
  <line x1="58" y1="418" x2="982" y2="418" stroke="#e2e5ea"/>
  <text x="58" y="440" font-size="11" class="t2">前提: Argo Rollouts コントローラを事前導入（install-argo-rollouts.md）／Argo CD は不要／使用エージェント: argo-rollouts-conversion-agent</text>

  <!-- Optional rollback note -->
  <text x="520" y="486" text-anchor="middle" font-size="11" class="t2">（任意）異常時は「中断して戻して」でカナリアを止め、全体に広げる前に安全側へ</text>
</svg>
