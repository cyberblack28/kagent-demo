<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" width="1280" height="720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s4t s4d" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="s4t">デモ4: 自作エージェントを UI から作る</title>
  <desc id="s4d">kagent UI の New Agent で、demo-app 専属・読み取り専用の demo-app-inspector を作るデモのスライド。Instructions・Model・Tools(読み取り系のみ)を設定し、k8s-agent と同じ質問を投げ比べると、demo-app-inspector は必ず【状況】【原因】【推奨アクション】の型で返し、修復を頼んでも提案だけで実行しない。右に OCI Generative AI・kagent(k8s-agent は全ツール、demo-app-inspector は読み取り系のみ)・OCI Kubernetes Engine の構成を示す。</desc>
  <defs>
    <marker id="sN" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="sP" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;} .tb{fill:#1a1d21;}
    .mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;}
    .ok{fill:#16a34a;font-weight:700;} .bad{fill:#dc2626;font-weight:700;} .pur{fill:#7c3aed;font-weight:700;}
    .pnl{fill:#f6f7f9;stroke:#e2e5ea;} .box{fill:#ffffff;stroke:#d7dbe0;}
    .lnN{stroke:#6b7280;stroke-width:1.8;} .lnP{stroke:#7c3aed;stroke-width:1.8;}
  </style>
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- ===== Title ===== -->
  <text x="40" y="62" font-size="26" class="t1">デモ4: 自作エージェントを UI から作る</text>
  <text x="40" y="94" font-size="15" class="t2">運用ルール（プロンプト）と権限（ツール）を持たせたエージェントを、その場で作る</text>

  <!-- ===== Left: Card 1 (作成) ===== -->
  <rect class="pnl" x="40" y="124" width="670" height="214" rx="12"/>
  <rect x="60" y="142" width="196" height="28" rx="14" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="158" y="161" text-anchor="middle" font-size="13" class="pur">demo-app-inspector</text>
  <text x="270" y="161" font-size="13.5" class="t2">① UI の New Agent で作る（YAML は書かない）</text>
  <rect class="box" x="60" y="182" width="630" height="104" rx="8"/>
  <text x="76" y="205" font-size="13.5" class="t1">Instructions</text>
  <text x="190" y="205" font-size="14" class="tb">demo-app 専属。調査のみで、変更は提案に留める</text>
  <text x="190" y="227" font-size="14" class="tb">報告は【状況】【原因】【推奨アクション】の型で</text>
  <text x="76" y="249" font-size="13.5" class="t1">Model</text>
  <text x="190" y="249" font-size="13" class="tb mono">oci-genai-openai-compatible</text>
  <text x="76" y="271" font-size="13.5" class="t1">Tools</text>
  <text x="190" y="271" font-size="14" class="tb">読み取り系だけを選ぶ（get / describe / logs / events）</text>
  <text x="60" y="316" font-size="14" class="t2">→ Agent リソースとしてデプロイ。<tspan class="pur">選ばなかった変更系ツールは、物理的に使えない</tspan></text>

  <!-- ===== Left: Card 2 (投げ比べ) ===== -->
  <rect class="pnl" x="40" y="352" width="670" height="258" rx="12"/>
  <rect x="60" y="370" width="112" height="28" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="116" y="389" text-anchor="middle" font-size="13" class="t1">k8s-agent</text>
  <text x="182" y="389" font-size="13" class="t2">と</text>
  <rect x="202" y="370" width="196" height="28" rx="14" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="300" y="389" text-anchor="middle" font-size="13" class="pur">demo-app-inspector</text>
  <text x="412" y="389" font-size="13.5" class="t2">② 同じ質問を投げ比べる</text>
  <rect class="box" x="60" y="410" width="630" height="40" rx="8"/>
  <text x="76" y="435" font-size="14" class="tb">demo-app namespace で問題のある Pod を調べて、対応方法を教えてください。</text>

  <text x="60" y="482" font-size="14" class="t2">→ k8s-agent：汎用的で丁寧だが、報告の形式は毎回変わる</text>
  <text x="60" y="508" font-size="14" class="t2">→ demo-app-inspector：<tspan class="ok">必ず【状況】【原因】【推奨アクション】の型で返る</tspan></text>
  <text x="60" y="534" font-size="14" class="t2">→ 「その Pod を直してください」と頼んでも、<tspan class="bad">提案だけで実行はしない（できない）</tspan></text>
  <text x="60" y="588" font-size="12.5" class="t2">「するな」とプロンプトで頼むのではなく、能力自体を与えない ＝ 権限設計</text>

  <!-- ===== Right: Architecture ===== -->
  <rect class="box" x="800" y="124" width="400" height="46" rx="8"/>
  <text x="1000" y="144" text-anchor="middle" font-size="14" class="t1">OCI Generative AI</text>
  <text x="1000" y="161" text-anchor="middle" font-size="11" class="t2 mono">openai.gpt-oss-120b</text>
  <line class="lnN" x1="1000" y1="170" x2="1000" y2="192" marker-end="url(#sN)"/>

  <rect class="pnl" x="760" y="196" width="480" height="188" rx="12"/>
  <text x="776" y="216" font-size="13" class="t1">kagent</text>
  <text x="1224" y="216" text-anchor="end" font-size="10.5" class="t2">下段は <tspan class="mono">kagent-tool-server</tspan> のツール</text>
  <rect x="780" y="226" width="200" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="880" y="251" text-anchor="middle" font-size="13" class="t1">k8s-agent</text>
  <rect x="1020" y="226" width="200" height="40" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1120" y="251" text-anchor="middle" font-size="13" class="pur">demo-app-inspector</text>

  <rect x="780" y="318" width="200" height="50" rx="8" fill="#ffffff" stroke="#d7dbe0" stroke-dasharray="5 4"/>
  <text x="880" y="339" text-anchor="middle" font-size="12.5" class="t1">変更系</text>
  <text x="880" y="357" text-anchor="middle" font-size="10" class="t2 mono">patch / apply / delete …</text>
  <rect class="box" x="1020" y="318" width="200" height="50" rx="8"/>
  <text x="1120" y="339" text-anchor="middle" font-size="12.5" class="t1">読み取り系</text>
  <text x="1120" y="357" text-anchor="middle" font-size="10" class="t2 mono">get / describe / logs / events</text>

  <line class="lnN" x1="880" y1="266" x2="880" y2="314" marker-end="url(#sN)"/>
  <line class="lnN" x1="910" y1="266" x2="1036" y2="314" marker-end="url(#sN)"/>
  <text x="888" y="296" font-size="10.5" class="t2">全部使える</text>
  <line class="lnP" x1="1120" y1="266" x2="1120" y2="314" marker-end="url(#sP)"/>
  <text x="1128" y="296" font-size="10.5" class="pur">読み取り系のみ</text>

  <rect class="pnl" x="760" y="404" width="480" height="206" rx="12"/>
  <text x="1012" y="424" text-anchor="middle" font-size="13" class="t1">OCI Kubernetes Engine</text>
  <rect class="box" x="780" y="434" width="440" height="164" rx="8"/>
  <text x="792" y="452" font-size="11" class="t2 mono">demo-app</text>

  <text x="1000" y="480" text-anchor="middle" font-size="10.5" class="t2">調査対象（デモ1の障害を仕込み直す）</text>
  <rect x="910" y="494" width="180" height="70" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="1000" y="518" text-anchor="middle" font-size="12" class="t1 mono">demo-crashloop</text>
  <text x="1000" y="538" text-anchor="middle" font-size="12" class="bad">CrashLoopBackOff</text>
  <text x="1000" y="555" text-anchor="middle" font-size="10" class="t2">exit 1 で再起動を繰り返す</text>

  <!-- ===== Bottom message ===== -->
  <rect x="40" y="632" width="1200" height="64" rx="12" fill="#f6f7f9" stroke="#e2e5ea"/>
  <text x="62" y="660" font-size="15" class="t1">エージェント ＝ プロンプト ＋ モデル ＋ ツール。<tspan class="pur">ツールを絞ることが権限設計になる</tspan></text>
  <text x="62" y="684" font-size="13" class="t2">誰が聞いても同じ型の報告が返る ＝ 運用の標準化（チームの障害報告テンプレートを埋め込む）</text>
</svg>
