apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-crashloop
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-crashloop
  template:
    metadata:
      labels:
        app: demo-crashloop
    spec:
      containers:
        - name: crash
          # OKE(cri-o)の短縮名問題を避けるため、完全修飾で指定する。
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "echo 'intentional crash for demo'; exit 1"]
