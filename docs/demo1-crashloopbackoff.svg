<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" width="1000" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d1t d1d" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="d1t">デモ1: CrashLoopBackOff の原因調査と修復</title>
  <desc id="d1d">demo-crashloop のコンテナは command が exit 1 のため起動直後に落ち、再起動を繰り返す。kagent がログと終了コードから原因を特定し、command を sleep infinity に変更して Running にする。</desc>
  <defs>
    <marker id="aN" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#16a34a"/></marker>
  </defs>
  <style>
    .pnl{fill:#f6f7f9;stroke:#e2e5ea;} .box{fill:#ffffff;stroke:#d7dbe0;}
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;} .mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;}
    .ok{fill:#16a34a;font-weight:700;} .bad{fill:#dc2626;font-weight:700;}
    .lnkN{stroke:#6b7280;stroke-width:2;} .lnkG{stroke:#16a34a;stroke-width:2;}
  </style>
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <!-- PANEL A: 障害 -->
  <rect class="pnl" x="18" y="40" width="300" height="430" rx="12"/>
  <circle cx="44" cy="66" r="12" fill="#dc2626"/><text x="44" y="70" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">1</text>
  <text x="66" y="70" font-size="15" class="t1">障害の状態</text>

  <rect class="box" x="58" y="90" width="220" height="50" rx="8"/>
  <text x="168" y="111" text-anchor="middle" font-size="13.5" class="t1">Deployment / demo-crashloop</text>
  <text x="168" y="129" text-anchor="middle" font-size="11" class="t2">image: busybox:1.36</text>
  <line class="lnkN" x1="168" y1="140" x2="168" y2="160" marker-end="url(#aN)"/>

  <rect class="box" x="58" y="162" width="220" height="52" rx="8" stroke="#dc2626"/>
  <text x="168" y="181" text-anchor="middle" font-size="11" class="t2">command</text>
  <text x="168" y="201" text-anchor="middle" font-size="12" class="bad mono">sh -c "… ; exit 1"</text>
  <line class="lnkN" x1="168" y1="214" x2="168" y2="234" marker-end="url(#aN)"/>

  <rect class="box" x="78" y="236" width="180" height="52" rx="8" stroke="#dc2626"/>
  <text x="168" y="255" text-anchor="middle" font-size="12" class="t2">Pod status</text>
  <text x="168" y="275" text-anchor="middle" font-size="13.5" class="bad">CrashLoopBackOff</text>

  <text x="168" y="322" text-anchor="middle" font-size="12.5" class="bad">起動する → 即 exit 1</text>
  <text x="168" y="344" text-anchor="middle" font-size="11.5" class="t2">再起動を繰り返す（Restarts↑）</text>

  <!-- PANEL B: kagent 調査 -->
  <rect class="pnl" x="350" y="40" width="300" height="430" rx="12"/>
  <circle cx="376" cy="66" r="12" fill="#7c3aed"/><text x="376" y="70" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">2</text>
  <text x="398" y="70" font-size="15" class="t1">kagent が調査</text>

  <rect x="378" y="86" width="244" height="26" rx="13" fill="none" stroke="#7c3aed" stroke-dasharray="4 3"/>
  <text x="500" y="103" text-anchor="middle" font-size="10.5" fill="#7c3aed" font-weight="700">読む: logs / describe / events</text>

  <rect class="box" x="378" y="122" width="244" height="92" rx="8"/>
  <text x="394" y="145" font-size="10.5" class="t2 mono">$ kubectl logs demo-crashloop</text>
  <text x="394" y="168" font-size="11.5" class="t1 mono">intentional crash for demo</text>
  <text x="394" y="191" font-size="11.5" class="bad mono">container exited — code 1</text>
  <line x1="394" y1="200" x2="606" y2="200" stroke="#eceef1"/>
  <text x="394" y="209" font-size="10.5" class="t2">exit code = 1</text>

  <text x="500" y="248" text-anchor="middle" font-size="12" class="t1">原因</text>
  <text x="500" y="270" text-anchor="middle" font-size="12.5" class="bad">コンテナが exit 1 で終了</text>
  <text x="500" y="322" text-anchor="middle" font-size="12" class="t1">→ 再起動ループになっている</text>
  <text x="500" y="344" text-anchor="middle" font-size="11.5" class="t2">根拠: ログ ＋ 終了コード</text>

  <!-- PANEL C: 修復後 -->
  <rect class="pnl" x="682" y="40" width="300" height="430" rx="12"/>
  <circle cx="708" cy="66" r="12" fill="#16a34a"/><text x="708" y="70" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">3</text>
  <text x="730" y="70" font-size="15" class="t1">修復後</text>

  <rect class="box" x="722" y="90" width="220" height="50" rx="8"/>
  <text x="832" y="111" text-anchor="middle" font-size="13.5" class="t1">Deployment / demo-crashloop</text>
  <text x="832" y="129" text-anchor="middle" font-size="11" class="t2">image: busybox:1.36</text>
  <line class="lnkG" x1="832" y1="140" x2="832" y2="160" marker-end="url(#aG)"/>

  <rect class="box" x="722" y="162" width="220" height="52" rx="8" stroke="#16a34a"/>
  <text x="832" y="181" text-anchor="middle" font-size="11" class="t2">command <tspan fill="#7c3aed" font-weight="700">←修正</tspan></text>
  <text x="832" y="201" text-anchor="middle" font-size="12" class="ok mono">sh -c "sleep infinity"</text>
  <line class="lnkG" x1="832" y1="214" x2="832" y2="234" marker-end="url(#aG)"/>

  <rect class="box" x="742" y="236" width="180" height="52" rx="8" stroke="#16a34a"/>
  <text x="832" y="255" text-anchor="middle" font-size="12" class="t2">Pod status</text>
  <text x="832" y="275" text-anchor="middle" font-size="13.5" class="ok">Running</text>

  <text x="832" y="322" text-anchor="middle" font-size="12.5" class="ok">落ちなくなり Running を維持</text>
  <text x="832" y="344" text-anchor="middle" font-size="11.5" class="t2">Restarts 0 を確認</text>

  <!-- 凡例 / ポイント -->
  <rect x="18" y="486" width="964" height="58" rx="10" fill="#f6f7f9" stroke="#e2e5ea"/>
  <circle cx="42" cy="507" r="6" fill="#dc2626"/><text x="54" y="511" font-size="11.5" class="t2">異常（CrashLoopBackOff）</text>
  <circle cx="42" cy="528" r="6" fill="#16a34a"/><text x="54" y="532" font-size="11.5" class="t2">正常（Running）</text>
  <text x="300" y="511" font-size="12" class="t1">見どころ：</text>
  <text x="300" y="531" font-size="11.5" class="t2">「起動して落ちる」障害。ログと exit code が原因の根拠</text>
  <text x="740" y="511" font-size="12" class="t1">修復の指示：</text>
  <text x="740" y="531" font-size="11.5" class="t2">command を "sleep infinity" に変更</text>
</svg>
