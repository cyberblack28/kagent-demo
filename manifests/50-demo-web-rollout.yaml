# デモ5(追加・Ochacafe 向け): Deployment demo-web を Argo Rollouts のカナリアに移行する。
# 本来はエージェント(argo-rollouts-conversion-agent)にチャットで生成・適用させるが、
# 本番で生成が滞ったときの「保険」として同等のマニフェストを置いておく。
#
# 注意:
# - このデモは既存の Deployment demo-web(manifests/10-demo-app.yaml)を「置き換える」。
#   適用前に Deployment を削除(またはスケール0)しておくこと。Service demo-web は
#   selector app=demo-web のままなので、Rollout の Pod にそのままルーティングされる。
# - Argo Rollouts コントローラの導入が前提(install-argo-rollouts.md 参照)。
# - トラフィックルーター(Ingress/Gateway)無しの basic canary のため、setWeight は
#   replicas に対する Pod 数で近似される(replicas:4 なら 25%→1, 50%→2, 100%→4)。
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-web
  namespace: demo-app
  labels:
    app: demo-web
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {}
        # 最後の pause の後に promote すると 100% へ昇格して完了する
