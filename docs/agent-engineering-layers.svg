<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 600" width="1120" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layt layd" font-family="ui-sans-serif, system-ui, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <title id="layt">AI エージェント運用の5レイヤーと kagent での実体</title>
  <desc id="layd">プロンプト・コンテキスト・ハーネス・ループ・グラフの5レイヤーについて、何を設計するか、kagent での実体、対応するデモを一覧にした表。プロンプトからハーネスまでがデモ1〜5で見てきた領域、ループとグラフがこれから適用を考える領域。レイヤーは置き換わるのではなく積み上がる。</desc>
  <style>
    .t1{fill:#1a1d21;font-weight:700;} .t2{fill:#6b7280;} .tb{fill:#1a1d21;}
    .hd{fill:#1a1d21;font-weight:700;}
    .mono{font-family:ui-monospace,'Cascadia Code',Consolas,monospace;}
    .pur{fill:#7c3aed;font-weight:700;}
    .sep{stroke:#e2e5ea;stroke-width:1;}
  </style>
  <rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="42" font-size="19" class="t1">AI エージェント運用の5レイヤー ― kagent ではどう実現されるか</text>
  <text x="30" y="66" font-size="12" class="t2">※ 確立された分類ではなく、実際に動かしてみた上での一つの整理</text>

  <!-- Table frame -->
  <rect x="30" y="88" width="1060" height="348" rx="10" fill="#ffffff" stroke="#d7dbe0"/>
  <!-- Header row -->
  <path d="M30 98 a10 10 0 0 1 10 -10 h1040 a10 10 0 0 1 10 10 v28 h-1060 z" fill="#eef0f3"/>
  <text x="54"  y="112" font-size="12.5" class="hd">レイヤー</text>
  <text x="246" y="112" font-size="12.5" class="hd">何を設計するか</text>
  <text x="496" y="112" font-size="12.5" class="hd">kagent での実体</text>
  <text x="876" y="112" font-size="12.5" class="hd">今日のデモ</text>
  <line class="sep" x1="30" y1="126" x2="1090" y2="126"/>

  <!-- Column separators -->
  <line class="sep" x1="230" y1="88" x2="230" y2="436"/>
  <line class="sep" x1="480" y1="88" x2="480" y2="436"/>
  <line class="sep" x1="860" y1="88" x2="860" y2="436"/>
  <!-- Row separators -->
  <line class="sep" x1="30" y1="188" x2="1090" y2="188"/>
  <line class="sep" x1="30" y1="250" x2="1090" y2="250"/>
  <line class="sep" x1="30" y1="312" x2="1090" y2="312"/>
  <line class="sep" x1="30" y1="374" x2="1090" y2="374"/>

  <!-- ===== Row 1: プロンプト ===== -->
  <rect x="30" y="126" width="5" height="62" fill="#cbd5e1"/>
  <circle cx="60" cy="157" r="10" fill="#94a3b8"/><text x="60" y="161" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">1</text>
  <text x="78" y="161" font-size="13.5" class="t1">プロンプト</text>
  <text x="246" y="163" font-size="12" class="tb">依頼の仕方・意図の伝え方</text>
  <text x="496" y="163" font-size="12" class="tb">チャット / システムプロンプト</text>
  <rect x="876" y="145" width="86" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="919" y="161" text-anchor="middle" font-size="11.5" class="t1">デモ1〜3</text>

  <!-- ===== Row 2: コンテキスト ===== -->
  <rect x="30" y="188" width="5" height="62" fill="#cbd5e1"/>
  <circle cx="60" cy="219" r="10" fill="#94a3b8"/><text x="60" y="223" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">2</text>
  <text x="78" y="223" font-size="13.5" class="t1">コンテキスト</text>
  <text x="246" y="225" font-size="12" class="tb">何を見せるか（情報の供給）</text>
  <text x="496" y="214" font-size="12" class="tb">MCP 経由で describe / logs / events を</text>
  <text x="496" y="233" font-size="12" class="tb">エージェント自身が取りに行く</text>
  <rect x="876" y="207" width="86" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="919" y="223" text-anchor="middle" font-size="11.5" class="t1">デモ2</text>

  <!-- ===== Row 3: ハーネス ===== -->
  <rect x="30" y="250" width="5" height="62" fill="#cbd5e1"/>
  <circle cx="60" cy="281" r="10" fill="#94a3b8"/><text x="60" y="285" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">3</text>
  <text x="78" y="285" font-size="13.5" class="t1">ハーネス</text>
  <text x="246" y="287" font-size="12" class="tb">何を「させない」か・実行環境</text>
  <text x="496" y="276" font-size="12" class="tb">ツール選択＝権限設計</text>
  <text x="496" y="295" font-size="12" class="tb">ModelConfig でモデル差し替え</text>
  <rect x="876" y="269" width="86" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="919" y="285" text-anchor="middle" font-size="11.5" class="t1">デモ4</text>

  <!-- ===== Row 4: ループ ===== -->
  <rect x="30" y="312" width="5" height="62" fill="#7c3aed"/>
  <circle cx="60" cy="343" r="10" fill="#7c3aed"/><text x="60" y="347" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">4</text>
  <text x="78" y="347" font-size="13.5" class="pur">ループ</text>
  <text x="246" y="349" font-size="12" class="tb">いつ動くか（起動の契機）</text>
  <text x="496" y="338" font-size="12" class="tb">khook が Kubernetes Event を検知し</text>
  <text x="496" y="357" font-size="12" class="tb">A2A でエージェントを自動起動</text>
  <rect x="876" y="318" width="132" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="942" y="333" text-anchor="middle" font-size="10.5" class="t1">デモ5（人が承認）</text>
  <text x="1016" y="333" font-size="11" class="t2">↓</text>
  <rect x="876" y="346" width="132" height="22" rx="11" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="942" y="361" text-anchor="middle" font-size="10.5" class="pur">デモ6（自動）</text>

  <!-- ===== Row 5: グラフ ===== -->
  <rect x="30" y="374" width="5" height="62" fill="#7c3aed"/>
  <circle cx="60" cy="405" r="10" fill="#7c3aed"/><text x="60" y="409" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">5</text>
  <text x="78" y="409" font-size="13.5" class="pur">グラフ</text>
  <text x="246" y="411" font-size="12" class="tb">誰に任せるか（役割分担）</text>
  <text x="496" y="400" font-size="12" class="tb">agent-as-tool（<tspan class="mono" font-size="11">type: Agent</tspan>）で A2A 委譲</text>
  <text x="496" y="419" font-size="11.5" class="t2">※ 静的な宣言的グラフ実行はロードマップ</text>
  <rect x="876" y="393" width="120" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="936" y="409" text-anchor="middle" font-size="11.5" class="t2">現状紹介のみ</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="452" width="14" height="14" rx="3" fill="#cbd5e1"/>
  <text x="52" y="464" font-size="11.5" class="t2">デモ1〜5 で見てきた領域</text>
  <rect x="240" y="452" width="14" height="14" rx="3" fill="#7c3aed"/>
  <text x="262" y="464" font-size="11.5" class="t2">これから適用を考える領域</text>

  <!-- ===== Note band ===== -->
  <rect x="30" y="484" width="1060" height="90" rx="10" fill="#f6f7f9" stroke="#e2e5ea"/>
  <text x="54" y="509" font-size="12.5" class="t1">ポイント：レイヤーは置き換わるのではなく、積み上がる</text>
  <text x="54" y="531" font-size="12" class="t2">デモ6 でもプロンプトは消えていない。その場で打つ代わりに、Hook の YAML に「宣言」として埋め込まれている。</text>
  <text x="54" y="555" font-size="12" class="t2">デモ5（カナリア）は新しいレイヤーではなく 1〜3 の総合。各ステップを人が承認する「手動のループ」＝デモ6 への橋渡し。</text>
</svg>
